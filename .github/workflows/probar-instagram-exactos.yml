name: Por Aca - Instagram diagnostico HTTP puntual

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probar-instagram-exactos.yml'

permissions:
  contents: read

concurrency:
  group: poraca-instagram-url-exacta
  cancel-in-progress: false

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Validar sintaxis del diagnostico HTTP
        run: python3 -m py_compile radar2/instagram_http_original_probe_20261105.py
      - name: Repetir dos perfiles con peticion HTTP directa sin navegador
        run: python3 radar2/instagram_http_original_probe_20261105.py
