name: Por Aca - QA de Radar sin escrituras
on:
  push:
    paths:
      - 'src/radar_parallel.py'
      - 'tests/test_radar_parallel.py'
      - 'src/radar_integrity_verify.py'
      - 'data/canonical_survival_ledger_20261101.json'
      - 'src/radar_category_pulse.py'
      - 'tests/test_radar_category_pulse.py'
      - 'src/radar_executive_gates.py'
      - 'tests/test_radar_integrity_verify.py'
      - 'tests/test_radar_executive_gates.py'
      - 'src/radar_agenda_adapters.py'
      - 'tests/test_radar_agenda_adapters.py'
      - 'sql/20261101_executive_readiness_gates_READ_ONLY.sql'
      - 'sql/20261102_generic_field_provenance_v2.sql'
      - 'sql/20261102_event_provenance_readback_READ_ONLY.sql'
      - 'tests/test_radar_provenance_contract_v2.py'
      - '.github/workflows/radar-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compilar codigo Python
        run: python3 -m compileall -q src
      - name: Ejecutar tests sin Neon y sin red
        run: python3 -m unittest discover -s tests -v
