name: Por Aca - QA histórico (manual, sin Neon)

# Duplicate automatic QA retired 2026-11-03. Keep manual fallback for diagnosis.
# All changes under src/tests/sql/data are covered by radar-definitivo-ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poraca-radar-legacy-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y ejecutar pruebas locales
        run: |
          python3 -m compileall -q src
          python3 -m unittest discover -s tests -v
