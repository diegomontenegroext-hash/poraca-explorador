name: Por Aca - primera escritura aislada (una vez)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/primer-write-neon.yml'

permissions:
  contents: read

concurrency:
  group: poraca-radar-paralelo
  cancel-in-progress: false

jobs:
  primer_write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Ejecutar tests
        run: python3 -m unittest discover -s tests -v
      - name: Instalar cliente PostgreSQL
        run: python3 -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Ejecutar primera adquisicion y registrar en base aislada
        env:
          NEON_EXPLORADOR_DATABASE_URL: ${{ secrets.NEON_EXPLORADOR_DATABASE_URL }}
        run: python3 src/radar_parallel.py --mode write
