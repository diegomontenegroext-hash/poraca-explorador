name: Por Acá - prueba de fuentes

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/probar-fuentes.yml'

permissions:
  contents: read

concurrency:
  group: poraca-explorador-prueba
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer repositorio
        uses: actions/checkout@v4
      - name: Validar codigo sin acceso externo
        run: python3 -m unittest discover -s tests -v
      - name: Probar nueve fuentes publicas
        run: python3 src/explore.py
