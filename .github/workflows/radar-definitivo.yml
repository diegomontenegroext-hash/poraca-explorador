name: Por Aca - Radar Definitivo (Neon operativo)

# Orquestador temporal: Guardia GPT en 05:00 / 13:00 / 21:00 ART.
# Cada commit a ops/radar-fallback-trigger.txt dispara un unico job.
# Sin cron GitHub hasta verificar por separado su confiabilidad.

on:
  push:
    branches: [main]
    paths:
      - 'ops/radar-fallback-trigger.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: "FULL o incremental; escritura operativa solo en staging Neon"
        required: true
        type: choice
        default: incremental
        options:
          - incremental
          - full

permissions:
  contents: read

concurrency:
  group: poraca-radar-definitivo-isolated
  cancel-in-progress: false

jobs:
  definitivo:
    name: Ingesta Neon desde Guardia GPT
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Resolver alcance e identidad del disparo
        id: alcance
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            mode="$(sed -n 's/^trigger_mode=//p' ops/radar-fallback-trigger.txt | tail -1)"
            slot="$(sed -n 's/^trigger_slot=//p' ops/radar-fallback-trigger.txt | tail -1)"
            day="$(sed -n 's/^trigger_date=//p' ops/radar-fallback-trigger.txt | tail -1)"
            [[ "$mode" == "full" || "$mode" == "incremental" ]] || { echo "::error::invalid trigger_mode"; exit 1; }
            [[ "$slot" == "05" || "$slot" == "13" || "$slot" == "21" || "$slot" == "bootstrap" ]] || { echo "::error::invalid trigger_slot"; exit 1; }
            [[ "$day" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid trigger_date"; exit 1; }
            echo "Disparo GPT: $day $slot / $mode"
          else
            mode="$MANUAL_MODE"
            [[ "$mode" == "full" || "$mode" == "incremental" ]] || exit 1
            echo "Disparo manual: $mode"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: QA local obligatorio
        run: |
          python3 -m compileall -q src
          python3 -m unittest discover -s tests -v
      - name: Cliente Neon y navegador para agenda Genda
        run: |
          python3 -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          # ubuntu-latest ya incluye Chrome; el adaptador usa channel="chrome".
          # Si Playwright no instala, Radar conserva extracción HTTP sin bloquearse.
          python3 -m pip install --disable-pip-version-check "playwright>=1.45,<2" || echo "::warning::Genda sin fallback de navegador"
      - name: Exigir secreto operativo
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
        run: |
          if [ -z "$NEON_RADAR_OPERATIONAL_DATABASE_URL" ]; then
            echo "::error::Falta secreto neondb, prohibido volver al laboratorio."
            exit 1
          fi
      - name: Registrar en Neon operativa
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
          RADAR_REQUIRE_OPERATIONAL: "true"
          RADAR_SCOPE: ${{ steps.alcance.outputs.mode }}
        run: python3 src/radar_definitivo.py --mode "$RADAR_SCOPE"
      - name: Medir renovación por rubro sin admitir eventos
        if: success()
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
        run: python3 src/radar_category_pulse.py
