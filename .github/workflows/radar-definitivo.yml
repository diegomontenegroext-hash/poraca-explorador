name: Por Aca - Radar Definitivo (operativo por etapas)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-definitivo.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "FULL diario o incremental; se graba en schema staging sin publicar"
        required: true
        type: choice
        default: incremental
        options:
          - incremental
          - full
  schedule:
    # America/Argentina/Buenos_Aires (UTC-3). GitHub puede retrasar.
    - cron: '17 6 * * *'       # FULL 03:17 ART diario
    - cron: '17 14,22 * * *'   # incrementales 11:17 / 19:17 ART

permissions:
  contents: read

concurrency:
  group: poraca-radar-definitivo-isolated
  cancel-in-progress: false

jobs:
  definitivo:
    name: Descubrir, deduplicar y registrar en staging Neon
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: QA local obligatorio
        run: |
          python3 -m compileall -q src
          python3 -m unittest discover -s tests -v
      - name: Cliente de Neon
        run: python3 -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Ejecutar Radar Definitivo (operativo al registrar secret especifico)
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
          NEON_EXPLORADOR_DATABASE_URL: ${{ secrets.NEON_EXPLORADOR_DATABASE_URL }}
          RADAR_SCOPE: ${{ github.event_name == 'push' && 'full' || github.event.schedule == '17 6 * * *' && 'full' || inputs.mode || 'incremental' }}
        run: python3 src/radar_definitivo.py --mode "$RADAR_SCOPE"
