name: Por Aca - Radar Definitivo (Neon operativo)

# Orquestador temporal: Guardia GPT en 05:00 / 13:00 / 21:00 ART.
# Cada commit a ops/radar-fallback-trigger.txt dispara un unico job.
# Sin cron GitHub hasta verificar por separado su confiabilidad.

on:
  push:
    branches: [main]
    paths:
      - 'ops/radar-fallback-trigger.txt'
      - 'ops/e2e-verification-trigger.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: "FULL / incremental para Radar, o verify_only sin ingesta ni escrituras"
        required: true
        type: choice
        default: incremental
        options:
          - incremental
          - full
          - verify_only

permissions:
  contents: read

concurrency:
  group: poraca-radar-definitivo-isolated
  cancel-in-progress: false

jobs:
  definitivo:
    name: Radar o certificacion puntual sin ingesta
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
        with:
          # Dos commits permiten identificar el archivo modificado sin adivinar.
          fetch-depth: 2
      - name: Resolver alcance e identidad del disparo
        id: alcance
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx 'ops/e2e-verification-trigger.txt'; then
              mode=verify_only
              echo "Certificacion E2E solicitada: sin ingesta, sin escrituras Neon."
            else
              mode="$(sed -n 's/^trigger_mode=//p' ops/radar-fallback-trigger.txt | tail -1)"
              slot="$(sed -n 's/^trigger_slot=//p' ops/radar-fallback-trigger.txt | tail -1)"
              day="$(sed -n 's/^trigger_date=//p' ops/radar-fallback-trigger.txt | tail -1)"
              [[ "$mode" == "full" || "$mode" == "incremental" ]] || { echo "::error::invalid trigger_mode"; exit 1; }
              [[ "$slot" == "05" || "$slot" == "13" || "$slot" == "21" || "$slot" == "bootstrap" ]] || { echo "::error::invalid trigger_slot"; exit 1; }
              [[ "$day" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid trigger_date"; exit 1; }
              echo "Disparo GPT: $day $slot / $mode"
            fi
          else
            mode="$MANUAL_MODE"
            [[ "$mode" == "full" || "$mode" == "incremental" || "$mode" == "verify_only" ]] || exit 1
            echo "Disparo manual: $mode"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: QA local obligatorio
        id: qa
        run: |
          python3 -m compileall -q src
          python3 -m unittest discover -s tests -v
      - name: Cliente Neon y navegador para agenda Genda
        run: |
          python3 -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          # ubuntu-latest ya incluye Chrome; el adaptador usa channel="chrome".
          # Si Playwright no instala, Radar conserva extracción HTTP sin bloquearse.
          if [[ "${{ steps.alcance.outputs.mode }}" != "verify_only" ]]; then
            python3 -m pip install --disable-pip-version-check "playwright>=1.45,<2" || echo "::warning::Genda sin fallback de navegador"
          fi
      - name: Exigir secreto operativo
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
        run: |
          if [ -z "$NEON_RADAR_OPERATIONAL_DATABASE_URL" ]; then
            echo "::error::Falta secreto neondb, prohibido volver al laboratorio."
            exit 1
          fi
      - name: Registrar en Neon operativa
        id: ingesta
        if: steps.alcance.outputs.mode != 'verify_only'
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
          RADAR_REQUIRE_OPERATIONAL: "true"
          RADAR_SCOPE: ${{ steps.alcance.outputs.mode }}
        run: python3 src/radar_definitivo.py --mode "$RADAR_SCOPE"
      - name: Medir renovación por rubro sin admitir eventos
        id: control
        if: success() && steps.alcance.outputs.mode != 'verify_only'
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
        run: python3 src/radar_category_pulse.py
      - name: Certificar lectura directa Radar→Neon para la API (sin escrituras)
        id: directa
        if: always() && steps.qa.outcome == 'success' && (steps.ingesta.outcome == 'success' || steps.alcance.outputs.mode == 'verify_only')
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
        run: python3 src/radar_direct_feed_verify.py
      - name: Certificar L4 integridad tras ingesta ordinaria (solo lectura)
        id: integridad
        if: always() && steps.qa.outcome == 'success' && steps.alcance.outputs.mode != 'verify_only' && steps.ingesta.outcome == 'success'
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
        run: python3 src/radar_integrity_verify.py
      - name: Certificar E2E en modo solo lectura (sin Radar)
        id: verificar
        if: success() && steps.alcance.outputs.mode == 'verify_only'
        env:
          NEON_RADAR_OPERATIONAL_DATABASE_URL: ${{ secrets.NEON_RADAR_OPERATIONAL_DATABASE_URL }}
        run: python3 src/radar_integrity_verify.py
      - name: Acta de cierre de ejecución, incluso ante fallos
        if: always()
        shell: bash
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
          INGEST_OUTCOME: ${{ steps.ingesta.outcome }}
          CONTROL_OUTCOME: ${{ steps.control.outcome }}
          DIRECT_OUTCOME: ${{ steps.directa.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integridad.outcome }}
          VERIFY_OUTCOME: ${{ steps.verificar.outcome }}
        run: |
          set -euo pipefail
          {
            echo
            echo "## Acta de cierre Radar (sin inferir contenido editorial)"
            echo
            echo "| Puerta | Estado técnico de GitHub |"
            echo "|---|---|"
            echo "| Pruebas QA | ${QA_OUTCOME:-unknown} |"
            echo "| Adquisición / escritura en staging | ${INGEST_OUTCOME:-unknown} |"
            echo "| Informe fuente, preadmisión y E2E | ${CONTROL_OUTCOME:-unknown} |"
            echo "| Lectura directa actual Radar → Neon/API (no promoción) | ${DIRECT_OUTCOME:-unknown} |"
            echo "| Verificación L4 tras ingesta (sin escrituras) | ${INTEGRITY_OUTCOME:-unknown} |"
            echo "| Certificación read-only independiente | ${VERIFY_OUTCOME:-unknown} |"
            echo
            if [[ "$DIRECT_OUTCOME" == "success" ]]; then
              echo "**LECTURA DIRECTA RADAR → NEON: PASS**, sin aprobación ni escrituras. Esto no cancela el P0 histórico."
            elif [[ "$DIRECT_OUTCOME" == "failure" ]]; then
              echo "**LECTURA DIRECTA RADAR → NEON: FAIL**, revisar entrada nueva separada de deudas anteriores."
            fi
            echo
            if [[ "$VERIFY_OUTCOME" != "skipped" && "$VERIFY_OUTCOME" != "" ]]; then
              if [[ "$VERIFY_OUTCOME" == "success" ]]; then
                echo "**INTEGRIDAD DE DATOS CHECK PASS**. HTTP API y web SSO siguen siendo controles distintos."
              else
                echo "**P0: CERTIFICACIÓN E2E FALLIDA**. Ninguna ingesta fue ejecutada. Ver error en step verificar."
              fi
            elif [[ "$DIRECT_OUTCOME" == "failure" ]]; then
              echo "**P0: RADAR DIRECTO NO CERTIFICADO**. El canal de descubrimientos debe investigarse separado de la historia canónica."
            elif [[ "$INTEGRITY_OUTCOME" == "failure" ]]; then
              echo "**P0: INTEGRIDAD L4 NO CERTIFICADA**. Ingesta de Radar ejecutada, pero contratos persistentes fallaron. La evidencia sigue en staging."
            elif [[ "$INGEST_OUTCOME" != "success" ]]; then
              echo "**INGESTA NO CERTIFICADA**: no atribuir a este run resultados previos."
            elif [[ "$CONTROL_OUTCOME" != "success" ]]; then
              echo "**CONTROL NO CERTIFICADO**: ingesta y reporte separados; revisar Neon en SELECT."
            else
              echo "Se produjeron los controles. Consultar estado Neon: GitHub success no implica agenda publicada."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
