name: Por Aca - Radar Definitivo (experimental)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-definitivo.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "FULL: barrido por lotes; incremental: fuentes vencidas"
        required: true
        type: choice
        default: incremental
        options:
          - incremental
          - full
  schedule:
    # Tres incrementales por dia. Argentina UTC-3: 23:27, 07:27, 15:27.
    - cron: '27 2,10,18 * * *'
    # Reexploracion FULL una vez por semana: domingos 02:42 ART.
    - cron: '42 5 * * 0'

permissions:
  contents: read

concurrency:
  group: poraca-radar-definitivo-isolated
  cancel-in-progress: false

jobs:
  definitivo:
    name: Fuentes, conexiones, entidades y memoria en Neon experimental
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: QA de reglas sin acceder a Neon
        run: |
          python3 -m compileall -q src
          python3 -m unittest discover -s tests -v
      - name: Cliente de Neon
        run: python3 -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Ejecutar Radar Definitivo
        env:
          NEON_EXPLORADOR_DATABASE_URL: ${{ secrets.NEON_EXPLORADOR_DATABASE_URL }}
          RADAR_SCOPE: ${{ github.event_name == 'push' && 'full' || github.event.schedule == '42 5 * * 0' && 'full' || inputs.mode || 'incremental' }}
        run: python3 src/radar_definitivo.py --mode "$RADAR_SCOPE"
