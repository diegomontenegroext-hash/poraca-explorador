name: Por Aca - QA Radar Definitivo
on:
  push:
    paths:
      - 'src/radar_adaptive_cadence.py'
      - 'tests/test_radar_adaptive_cadence.py'
      - 'src/radar_adaptive_discovery.py'
      - 'tests/test_radar_adaptive_discovery.py'
      - 'src/radar_adaptive_shadow.py'
      - 'tests/test_radar_adaptive_shadow.py'
      - 'sql/20261031_radar_adaptive_shadow_readonly_v1.sql'
      - 'src/radar_definitivo.py'
      - 'src/radar_certification_matrix.py'
      - 'tests/test_radar_certification_matrix.py'
      - 'sql/20261031_certificacion_punta_a_punta_readonly_v1.sql'
      - 'src/radar_end_to_end.py'
      - 'tests/test_radar_end_to_end.py'
      - 'src/radar_source_learning.py'
      - 'tests/test_radar_source_learning.py'
      - 'src/radar_editorial_preview.py'
      - 'tests/test_radar_editorial_preview.py'
      - 'src/radar_category_pulse.py'
      - 'src/radar_funnel_metrics.py'
      - 'tests/test_radar_funnel_metrics.py'
      - 'tests/test_radar_category_pulse.py'
      - '.github/workflows/radar-definitivo.yml'
      - 'src/instagram_seed_inbox.py'
      - 'ops/instagram-exact-seeds.json'
      - 'tests/test_instagram_seed_inbox.py'
      - 'src/radar_parallel.py'
      - 'src/radar_agenda_adapters.py'
      - 'src/radar_ical_generic.py'
      - 'tests/test_radar_generic_ical.py'
      - 'src/radar_ical_agenda.py'
      - 'tests/test_radar_official_ics.py'
      - 'src/radar_evidence_quality.py'
      - 'src/radar_gate_alias_preflight.py'
      - 'src/radar_function_gate_review.py'
      - 'src/radar_health.py'
      - 'src/radar_url_clock_review.py'
      - 'tests/test_radar_reliability.py'
      - 'tests/test_radar_function_gate_review.py'
      - 'sql/20261029_function_identity_preflight_v2.sql'
      - 'tests/test_radar_gate_alias_preflight.py'
      - 'tests/test_radar_evidence_quality.py'
      - 'src/radar_genda_browser.py'
      - 'tests/test_radar_definitivo.py'
      - 'tests/test_radar_agenda_adapters.py'
      - 'tests/test_radar_el_dia_agenda.py'
      - '.github/workflows/radar-definitivo-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y probar sin Neon
        run: |
          python3 -m compileall -q src
          python3 -m unittest discover -s tests -v
