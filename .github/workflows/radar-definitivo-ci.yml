name: Por Aca - QA Radar Definitivo

# One non-writing CI workflow for code/contracts. Historical QA is manual-only.
# Never cancel operational Radar: its own workflow serializes real ingestions.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'sql/**'
      - 'data/**'
      - 'ops/instagram-exact-seeds.json'
      - '.github/workflows/radar-definitivo-ci.yml'
      - '.github/workflows/radar-ci.yml'
      - '.github/workflows/radar-definitivo.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel only a previous code QA from a push to the same branch.
# Explicit manual checks are separately grouped, and Radar ingestions untouched.
concurrency:
  group: poraca-radar-code-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  qa:
    name: Compilacion y suite completa sin Neon
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y probar sin Neon ni servicios externos
        run: |
          python3 -m compileall -q src
          python3 -m unittest discover -s tests -v
